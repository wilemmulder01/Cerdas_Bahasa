<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CERDAS BAHASA - MPI Bahasa Jerman</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Inter', 'sans-serif'] },
                    colors: {
                        primary: '#4F46E5', // Indigo 600
                        secondary: '#7C3AED', // Violet 600
                        surface: '#F8FAFC',
                    }
                }
            }
        }
    </script>
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #0f172a; /* Dark border for 16:9 framing */ display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; }
        #root { width: 100%; max-width: 1920px; aspect-ratio: 16/9; background-color: #F8FAFC; overflow: hidden; position: relative; box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25); }
        @media (max-aspect-ratio: 16/9) { #root { aspect-ratio: auto; height: 100vh; } } /* Fallback for narrow screens */
        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        .glass-panel { background: rgba(255, 255, 255, 0.9); backdrop-filter: blur(10px); border: 1px solid rgba(255,255,255,0.2); }
        .slide-in { animation: slideIn 0.3s ease-out forwards; }
        @keyframes slideIn { from { transform: translateX(-100%); } to { transform: translateX(0); } }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        // --- KONFIGURASI MASTER ---
        const CONFIG = {
            namaMPI: "CERDAS BAHASA",
            guru: "ERNA LALOPUA",
            sekolah: "SMA KRISTEN AMETH",
            jenjang: "SMA",
            fase: "E",
            kelas: "XI",
            mapel: "BAHASA JERMAN",
            materi: "FAMILIE (Keluarga)",
            topik: "Perkenalan Anggota Keluarga",
            tp: "Murid Mampu Mengidentifikasi Kosakata dan Memperkenalkan Anggota Keluarga",
            waktu: "2x45 menit",
            konteks: "MALUKU",
            tagline: "Satu Media, Beragam Mata Pelajaran, Pembelajaran Lebih Bermakna."
        };

        // --- UTILITAS TEXT TO SPEECH ---
        const playTTS = (text, lang = 'de-DE') => {
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel();
                const utterance = new SpeechSynthesisUtterance(text);
                utterance.lang = lang;
                // Optional: Adjust rate/pitch for better learner experience
                utterance.rate = 0.85; 
                window.speechSynthesis.speak(utterance);
            }
        };

        const TTSIcon = ({ text, lang='de-DE' }) => (
            <button onClick={() => playTTS(text, lang)} className="ml-2 text-primary hover:text-secondary focus:outline-none bg-indigo-100 p-2 rounded-full inline-flex items-center justify-center transition-colors" title="Dengarkan Pengucapan">
                <i className="fas fa-volume-up"></i>
            </button>
        );

        // --- DATA KONTEN PEMBELAJARAN ---
        const MODULES = [
            { id: 'cover', title: 'Beranda', icon: 'fa-home', type: 'cover' },
            { id: 'orientasi', title: 'Orientasi Pembelajaran', icon: 'fa-compass', type: 'orientasi' },
            { id: 'apersepsi', title: 'Apersepsi', icon: 'fa-lightbulb', type: 'content' },
            { id: 'teori_dasar', title: 'Kosakata Dasar', icon: 'fa-book', type: 'content' },
            { id: 'teori_gramatik', title: 'Tata Bahasa (Grammatik)', icon: 'fa-spell-check', type: 'content' },
            { id: 'visualisasi', title: 'Eksplorasi Visual', icon: 'fa-sitemap', type: 'visual' },
            { id: 'aktivitas', title: 'Aktivitas Interaktif', icon: 'fa-gamepad', type: 'activity' },
            { id: 'penerapan', title: 'Penerapan Konsep', icon: 'fa-pen-to-square', type: 'penerapan' },
            { id: 'rangkuman', title: 'Rangkuman', icon: 'fa-list-check', type: 'rangkuman' },
            { id: 'refleksi', title: 'Refleksi', icon: 'fa-mirror', type: 'refleksi' },
            { id: 'asesmen', title: 'Asesmen Akhir', icon: 'fa-clipboard-check', type: 'asesmen' },
        ];

        // --- KOMPONEN UI DASAR ---
        const TopBar = ({ toggleSidebar, title, onPrev, onNext, currentIdx, totalMods, toggleFullscreen }) => (
            <div className="h-16 bg-white shadow-sm flex items-center justify-between px-4 lg:px-6 relative z-20">
                <div className="flex items-center gap-4">
                    <button onClick={toggleSidebar} className="p-2 rounded-lg hover:bg-gray-100 text-gray-700 focus:outline-none transition">
                        <i className="fas fa-bars text-xl"></i>
                    </button>
                    <div className="hidden sm:block">
                        <h1 className="font-bold text-gray-800 text-lg leading-tight">{CONFIG.namaMPI}</h1>
                        <p className="text-xs text-gray-500">{CONFIG.mapel} - {CONFIG.materi}</p>
                    </div>
                </div>
                
                <div className="flex items-center gap-2">
                    <span className="text-sm font-medium text-gray-500 mr-2 hidden md:block">
                        Bagian {currentIdx + 1} dari {totalMods}
                    </span>
                    <button onClick={onPrev} disabled={currentIdx === 0} className={`p-2 rounded-lg ${currentIdx === 0 ? 'text-gray-300' : 'text-primary hover:bg-indigo-50'}`}>
                        <i className="fas fa-chevron-left text-xl"></i>
                    </button>
                    <button onClick={onNext} disabled={currentIdx === totalMods - 1} className={`p-2 rounded-lg ${currentIdx === totalMods - 1 ? 'text-gray-300' : 'text-primary hover:bg-indigo-50'}`}>
                        <i className="fas fa-chevron-right text-xl"></i>
                    </button>
                    <button onClick={toggleFullscreen} className="p-2 ml-2 text-gray-600 hover:bg-gray-100 rounded-lg hidden sm:block" title="Layar Penuh">
                        <i className="fas fa-expand text-lg"></i>
                    </button>
                </div>
            </div>
        );

        const Sidebar = ({ isOpen, onClose, modules, currentModule, onSelect }) => (
            <>
                {/* Overlay for mobile */}
                {isOpen && (
                    <div className="fixed inset-0 bg-black/50 z-30 lg:hidden" onClick={onClose}></div>
                )}
                
                <div className={`fixed top-0 left-0 h-full w-72 bg-white shadow-2xl z-40 transform transition-transform duration-300 ease-in-out ${isOpen ? 'translate-x-0' : '-translate-x-full'} flex flex-col`}>
                    <div className="p-4 border-b flex justify-between items-center bg-indigo-50">
                        <div>
                            <h2 className="font-bold text-primary text-lg">Menu Navigasi</h2>
                            <p className="text-xs text-gray-600">Mode Mengajar Klasikal</p>
                        </div>
                        <button onClick={onClose} className="p-2 text-gray-500 hover:text-red-500 rounded-lg hover:bg-white">
                            <i className="fas fa-times text-xl"></i>
                        </button>
                    </div>
                    
                    <div className="flex-1 overflow-y-auto py-2 hide-scrollbar">
                        {modules.map((mod, idx) => (
                            <button 
                                key={mod.id}
                                onClick={() => { onSelect(idx); onClose(); }}
                                className={`w-full text-left px-6 py-3 flex items-center gap-4 hover:bg-indigo-50 transition-colors ${currentModule === mod.id ? 'bg-indigo-100 border-l-4 border-primary text-primary font-semibold' : 'text-gray-700'}`}
                            >
                                <i className={`fas ${mod.icon} w-6 text-center ${currentModule === mod.id ? 'text-primary' : 'text-gray-400'}`}></i>
                                <span>{mod.title}</span>
                            </button>
                        ))}
                    </div>

                    <div className="p-4 border-t bg-gray-50">
                        <div className="text-xs text-gray-500">
                            <p className="font-semibold text-gray-700">{CONFIG.guru}</p>
                            <p>{CONFIG.sekolah}</p>
                            <p>Kelas {CONFIG.kelas} | Fase {CONFIG.fase}</p>
                        </div>
                    </div>
                </div>
            </>
        );

        // --- KOMPONEN KONTEN KHUSUS ---
        
        const Cover = ({ onStart }) => (
            <div className="h-full flex flex-col items-center justify-center bg-gradient-to-br from-indigo-50 to-white p-8 text-center relative overflow-hidden">
                <div className="absolute top-0 left-0 w-full h-2 bg-gradient-to-r from-primary to-secondary"></div>
                <div className="bg-white p-8 md:p-12 rounded-3xl shadow-xl max-w-4xl w-full z-10 glass-panel">
                    <span className="inline-block px-4 py-1 rounded-full bg-indigo-100 text-primary text-sm font-bold tracking-wider mb-6">
                        {CONFIG.jenjang} - KELAS {CONFIG.kelas}
                    </span>
                    <h1 className="text-4xl md:text-6xl font-extrabold text-gray-900 mb-4 tracking-tight">
                        {CONFIG.mapel}
                    </h1>
                    <h2 className="text-2xl md:text-3xl font-light text-gray-600 mb-8">
                        Topik: <span className="font-semibold text-primary">{CONFIG.materi}</span>
                    </h2>
                    
                    <div className="grid grid-cols-1 md:grid-cols-2 gap-6 mb-10 text-left">
                        <div className="bg-indigo-50 p-4 rounded-xl border border-indigo-100">
                            <i className="fas fa-bullseye text-secondary mb-2 text-xl"></i>
                            <h3 className="font-bold text-gray-800 text-sm mb-1">Tujuan Pembelajaran</h3>
                            <p className="text-xs text-gray-600 leading-relaxed">{CONFIG.tp}</p>
                        </div>
                        <div className="bg-indigo-50 p-4 rounded-xl border border-indigo-100">
                            <i className="fas fa-clock text-secondary mb-2 text-xl"></i>
                            <h3 className="font-bold text-gray-800 text-sm mb-1">Alokasi Waktu</h3>
                            <p className="text-xs text-gray-600 leading-relaxed">{CONFIG.waktu} • Pendekatan Klasikal</p>
                        </div>
                    </div>
                    
                    <button onClick={onStart} className="bg-gradient-to-r from-primary to-secondary text-white px-10 py-4 rounded-full font-bold text-lg shadow-lg hover:shadow-xl hover:scale-105 transition-all duration-300">
                        <i className="fas fa-play mr-2"></i> MULAI PEMBELAJARAN
                    </button>
                    
                    <p className="mt-6 text-xs text-gray-400 italic">Oleh: {CONFIG.guru} | {CONFIG.sekolah}</p>
                </div>
                
                {/* Decorative background elements */}
                <div className="absolute top-20 left-10 w-32 h-32 bg-indigo-200 rounded-full mix-blend-multiply filter blur-2xl opacity-50 animate-blob"></div>
                <div className="absolute top-40 right-20 w-40 h-40 bg-purple-200 rounded-full mix-blend-multiply filter blur-2xl opacity-50 animate-blob animation-delay-2000"></div>
            </div>
        );

        const Orientasi = () => (
            <div className="h-full p-8 md:p-12 overflow-y-auto bg-surface">
                <h2 className="text-3xl font-bold text-gray-800 mb-6 border-l-8 border-primary pl-4">Halo, Willkommen!</h2>
                
                <div className="bg-white rounded-2xl shadow-md p-6 mb-8 flex flex-col md:flex-row gap-6 items-center">
                    <img src="https://placehold.co/400x300/4F46E5/ffffff?text=Keluarga+di+Maluku" alt="Ilustrasi Keluarga" className="rounded-xl shadow-sm w-full md:w-1/3 object-cover h-48" />
                    <div className="flex-1">
                        <h3 className="text-xl font-bold text-primary mb-3">Mengapa Belajar "Familie"?</h3>
                        <p className="text-gray-700 leading-relaxed mb-4">
                            Di {CONFIG.konteks}, nilai kekeluargaan sangatlah erat. Kita sering memperkenalkan keluarga kita kepada teman baru atau orang yang berkunjung. Nah, bayangkan kalian memiliki teman dari Jerman, Swiss, atau Austria yang berkunjung, dan kalian ingin menceritakan tentang keluarga kalian!
                        </p>
                        <div className="bg-amber-50 border-l-4 border-amber-400 p-4 rounded-r-lg">
                            <p className="font-semibold text-amber-800 flex items-center gap-2">
                                <i className="fas fa-question-circle"></i> Pertanyaan Pemantik:
                            </p>
                            <p className="text-amber-900 mt-1 italic">"Bagaimana cara menyebutkan anggota keluargamu dan memperkenalkan mereka dalam bahasa Jerman dengan benar?"</p>
                        </div>
                    </div>
                </div>
            </div>
        );

        const Apersepsi = () => (
            <div className="h-full p-8 overflow-y-auto">
                <h2 className="text-3xl font-bold text-gray-800 mb-6 border-l-8 border-primary pl-4">Apersepsi: Mengenal Kata Ganti</h2>
                <div className="bg-white rounded-2xl shadow-sm border border-gray-100 p-8 max-w-4xl mx-auto">
                    <p className="text-lg text-gray-700 mb-6 leading-relaxed">
                        Sebelum kita masuk ke nama-nama anggota keluarga, mari kita pahami sebuah konsep penting dalam bahasa Jerman. Dalam bahasa Indonesia, kita mengenal kata benda (ayah, ibu, buku). Dalam bahasa Jerman, <strong>setiap kata benda memiliki "jenis kelamin" gramatikal (Gender)</strong>.
                    </p>
                    
                    <div className="grid grid-cols-1 md:grid-cols-3 gap-6 mb-8">
                        <div className="bg-blue-50 p-6 rounded-xl border border-blue-200 text-center">
                            <div className="w-12 h-12 bg-blue-500 text-white rounded-full flex items-center justify-center mx-auto mb-3 text-xl"><i className="fas fa-mars"></i></div>
                            <h3 className="font-bold text-blue-800 text-lg mb-2">Maskulin (Laki-laki)</h3>
                            <p className="text-blue-900 bg-blue-200 px-3 py-1 rounded-full inline-block font-mono font-bold">der</p>
                        </div>
                        <div className="bg-pink-50 p-6 rounded-xl border border-pink-200 text-center">
                            <div className="w-12 h-12 bg-pink-500 text-white rounded-full flex items-center justify-center mx-auto mb-3 text-xl"><i className="fas fa-venus"></i></div>
                            <h3 className="font-bold text-pink-800 text-lg mb-2">Feminim (Perempuan)</h3>
                            <p className="text-pink-900 bg-pink-200 px-3 py-1 rounded-full inline-block font-mono font-bold">die</p>
                        </div>
                        <div className="bg-green-50 p-6 rounded-xl border border-green-200 text-center">
                            <div className="w-12 h-12 bg-green-500 text-white rounded-full flex items-center justify-center mx-auto mb-3 text-xl"><i className="fas fa-neuter"></i></div>
                            <h3 className="font-bold text-green-800 text-lg mb-2">Netral</h3>
                            <p className="text-green-900 bg-green-200 px-3 py-1 rounded-full inline-block font-mono font-bold">das</p>
                        </div>
                    </div>
                    
                    <div className="bg-indigo-50 p-4 rounded-lg flex items-start gap-4">
                        <i className="fas fa-info-circle text-primary text-2xl mt-1"></i>
                        <div>
                            <h4 className="font-bold text-indigo-900">Mengapa ini penting untuk tema Keluarga?</h4>
                            <p className="text-indigo-800 mt-1">Karena kata ganti kepunyaan (seperti "ku" dalam "ayahku") akan berubah bentuk tergantung pada gender kata bendanya! Kita akan melihat ini di bagian Tata Bahasa.</p>
                        </div>
                    </div>
                </div>
            </div>
        );

        const TeoriDasar = () => {
            const vocab = [
                { de: "der Vater", id: "Ayah", gender: "m" },
                { de: "die Mutter", id: "Ibu", gender: "f" },
                { de: "der Sohn", id: "Anak laki-laki", gender: "m" },
                { de: "die Tochter", id: "Anak perempuan", gender: "f" },
                { de: "der Bruder", id: "Saudara laki-laki", gender: "m" },
                { de: "die Schwester", id: "Saudara perempuan", gender: "f" },
                { de: "der Großvater / der Opa", id: "Kakek", gender: "m" },
                { de: "die Großmutter / die Oma", id: "Nenek", gender: "f" },
                { de: "der Onkel", id: "Paman", gender: "m" },
                { de: "die Tante", id: "Bibi", gender: "f" }
            ];

            return (
                <div className="h-full p-8 overflow-y-auto">
                    <h2 className="text-3xl font-bold text-gray-800 mb-2 border-l-8 border-primary pl-4">Kosakata Inti: Die Familienmitglieder</h2>
                    <p className="text-gray-600 mb-8 pl-6">Anggota Keluarga. Klik ikon speaker untuk mendengarkan pelafalan yang benar.</p>
                    
                    <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-2 gap-4 max-w-5xl mx-auto">
                        {vocab.map((v, i) => (
                            <div key={i} className={`flex items-center justify-between p-4 rounded-xl border-l-4 shadow-sm bg-white hover:shadow-md transition-shadow ${v.gender === 'm' ? 'border-blue-500' : 'border-pink-500'}`}>
                                <div>
                                    <h3 className="font-bold text-xl text-gray-800 flex items-center gap-2">
                                        {v.de} <TTSIcon text={v.de} />
                                    </h3>
                                    <p className="text-gray-500 mt-1">{v.id}</p>
                                </div>
                                <div className={`w-10 h-10 rounded-full flex items-center justify-center opacity-20 ${v.gender === 'm' ? 'bg-blue-500 text-blue-900' : 'bg-pink-500 text-pink-900'}`}>
                                    <i className={`fas ${v.gender === 'm' ? 'fa-mars' : 'fa-venus'} text-xl`}></i>
                                </div>
                            </div>
                        ))}
                    </div>
                </div>
            );
        };

        const TeoriGramatik = () => (
            <div className="h-full p-8 overflow-y-auto">
                <h2 className="text-3xl font-bold text-gray-800 mb-6 border-l-8 border-primary pl-4">Tata Bahasa: Possessivpronomen (Kata Ganti Kepunyaan)</h2>
                
                <div className="grid grid-cols-1 lg:grid-cols-2 gap-8 max-w-6xl mx-auto">
                    {/* Theory Block 1 */}
                    <div className="bg-white rounded-2xl shadow-sm border border-gray-200 overflow-hidden">
                        <div className="bg-indigo-600 text-white p-4">
                            <h3 className="text-xl font-bold">Mein vs. Meine (Kepunyaanku)</h3>
                        </div>
                        <div className="p-6">
                            <p className="text-gray-700 mb-4">
                                Untuk mengatakan "Ayahku" atau "Ibuku", kita menggunakan kata <strong>mein</strong> atau <strong>meine</strong>. Aturan pemakaiannya bergantung pada gender (artikel) kata benda.
                            </p>
                            
                            <table className="w-full text-left border-collapse mb-6">
                                <thead>
                                    <tr className="bg-gray-100">
                                        <th className="p-3 border-b">Gender</th>
                                        <th className="p-3 border-b">Kata Ganti</th>
                                        <th className="p-3 border-b">Contoh</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    <tr>
                                        <td className="p-3 border-b text-blue-700 font-semibold">Maskulin (der)</td>
                                        <td className="p-3 border-b font-bold bg-blue-50">mein</td>
                                        <td className="p-3 border-b">
                                            Das ist <strong>mein</strong> Vater.<TTSIcon text="Das ist mein Vater" />
                                        </td>
                                    </tr>
                                    <tr>
                                        <td className="p-3 border-b text-pink-700 font-semibold">Feminim (die)</td>
                                        <td className="p-3 border-b font-bold bg-pink-50">meine</td>
                                        <td className="p-3 border-b">
                                            Das ist <strong>meine</strong> Mutter.<TTSIcon text="Das ist meine Mutter" />
                                        </td>
                                    </tr>
                                </tbody>
                            </table>
                            
                            <div className="bg-red-50 border-l-4 border-red-500 p-3 rounded text-sm">
                                <p className="font-bold text-red-800">Miskonsepsi Umum:</p>
                                <p className="text-red-700">Siswa sering menggunakan "mein" untuk semua hal (Mein Mutter ❌). Ingat aturan akhiran <strong>-e</strong> untuk kata benda feminim (die)!</p>
                            </div>
                        </div>
                    </div>

                    {/* Theory Block 2 */}
                    <div className="bg-white rounded-2xl shadow-sm border border-gray-200 overflow-hidden">
                        <div className="bg-secondary text-white p-4">
                            <h3 className="text-xl font-bold">Dein vs. Deine (Kepunyaanmu)</h3>
                        </div>
                        <div className="p-6">
                            <p className="text-gray-700 mb-4">
                                Pola yang sama persis berlaku ketika kita ingin mengatakan "milikmu" (dalam situasi informal/teman sebaya).
                            </p>
                            <table className="w-full text-left border-collapse mb-6">
                                <thead>
                                    <tr className="bg-gray-100">
                                        <th className="p-3 border-b">Gender</th>
                                        <th className="p-3 border-b">Kata Ganti</th>
                                        <th className="p-3 border-b">Contoh</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    <tr>
                                        <td className="p-3 border-b text-blue-700 font-semibold">Maskulin (der)</td>
                                        <td className="p-3 border-b font-bold bg-blue-50">dein</td>
                                        <td className="p-3 border-b">
                                            Ist das <strong>dein</strong> Bruder?<TTSIcon text="Ist das dein Bruder?" />
                                        </td>
                                    </tr>
                                    <tr>
                                        <td className="p-3 border-b text-pink-700 font-semibold">Feminim (die)</td>
                                        <td className="p-3 border-b font-bold bg-pink-50">deine</td>
                                        <td className="p-3 border-b">
                                            Ist das <strong>deine</strong> Schwester?<TTSIcon text="Ist das deine Schwester?" />
                                        </td>
                                    </tr>
                                </tbody>
                            </table>
                            
                            <div className="bg-green-50 border-l-4 border-green-500 p-3 rounded text-sm">
                                <p className="font-bold text-green-800">Tips Mengingat:</p>
                                <p className="text-green-700">Perhatikan polanya! m<strong>ein</strong>/d<strong>ein</strong> (maskulin/netral) dan m<strong>eine</strong>/d<strong>eine</strong> (feminim/jamak). Huruf 'e' di akhir menandakan ciri khas feminim.</p>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        );

        const Visualisasi = () => {
            const [selectedNode, setSelectedNode] = useState(null);
            
            const nodes = {
                opa: { id: 'opa', label: 'Der Opa (Hans)', type: 'm', desc: 'Mein Großvater. Er ist 70 Jahre alt.' },
                oma: { id: 'oma', label: 'Die Oma (Maria)', type: 'f', desc: 'Meine Großmutter. Sie ist 68 Jahre alt.' },
                vater: { id: 'vater', label: 'Der Vater (Peter)', type: 'm', desc: 'Mein Vater. Er ist Arzt.' },
                mutter: { id: 'mutter', label: 'Die Mutter (Anna)', type: 'f', desc: 'Meine Mutter. Sie ist Lehrerin.' },
                ich: { id: 'ich', label: 'Ich (Kamu)', type: 'neutral', desc: 'Das bin ich!' },
                schwester: { id: 'schwester', label: 'Die Schwester (Lisa)', type: 'f', desc: 'Meine Schwester. Sie ist 15 Jahre alt.' }
            };

            const Node = ({ id }) => {
                const data = nodes[id];

        const Asesmen = () => {
            const [started, setStarted] = useState(false);
            const [currentQ, setCurrentQ] = useState(0);
            const [answers, setAnswers] = useState({}); // { 1: 'der Vater', 5: ['opt1', 'opt2'] }
            const [finished, setFinished] = useState(false);
            const [scoreData, setScoreData] = useState(null);

            const handleAnswer = (qId, option, isPGK) => {
                if (isPGK) {
                    const currentAns = answers[qId] || [];
                    if (currentAns.includes(option)) {
                        setAnswers({ ...answers, [qId]: currentAns.filter(item => item !== option) });
                    } else {
                        setAnswers({ ...answers, [qId]: [...currentAns, option] });
                    }
                } else {
                    setAnswers({ ...answers, [qId]: option });
                }
            };

            const calculateScore = () => {
                let totalScore = 0;
                let details = [];

                ASSESSMENT_DATA.forEach(q => {
                    let point = 0;
                    const userAns = answers[q.id];

                    if (q.type === 'PG' || q.type === 'BS') {
                        if (userAns === q.answer) point = 10;
                    } else if (q.type === 'PGK') {
                        if (userAns && Array.isArray(userAns)) {
                            // Partial scoring for PGK
                            const correctNeeded = q.answer.length;
                            const pointPerCorrect = 10 / correctNeeded;
                            
                            let correctSelected = 0;
                            let wrongSelected = 0;

                            userAns.forEach(ans => {
                                if (q.answer.includes(ans)) correctSelected++;
                                else wrongSelected++;
                            });

                            // Calculate raw score, penalize wrong answers, minimum 0.
                            const rawScore = (correctSelected * pointPerCorrect) - (wrongSelected * pointPerCorrect);
                            point = Math.max(0, Math.min(10, Math.round(rawScore))); // Round to nearest int
                        }
                    }

                    totalScore += point;
                    details.push({
                        q: q,
                        userAns: userAns,
                        isCorrect: point === 10,
                        point: point
                    });
                });

                setScoreData({ total: totalScore, details });
                setFinished(true);
            };

                return (
                    <div className="h-full p-8 overflow-y-auto bg-surface">
                        <div className="max-w-4xl mx-auto">
                            <div className="bg-white rounded-3xl shadow-lg border border-gray-100 p-8 mb-8 text-center">
                                <h2 className="text-3xl font-bold text-gray-800 mb-2">Hasil Asesmen</h2>
                                <div className={`text-6xl font-extrabold my-6 ${scoreData.total >= 70 ? 'text-green-500' : 'text-amber-500'}`}>
                                    {scoreData.total}
                                </div>
                                <p className="text-gray-600 mb-6">Skor Maksimal: 100</p>
                                <button onClick={resetAsesmen} className="bg-gray-200 hover:bg-gray-300 text-gray-800 font-bold py-2 px-6 rounded-lg transition">
                                    <i className="fas fa-rotate-left mr-2"></i> Ulangi Asesmen
                                </button>
                            </div>

                            <h3 className="text-xl font-bold text-gray-800 mb-4 border-l-4 border-secondary pl-3">Pembahasan</h3>
                            <div className="space-y-6">
                                {scoreData.details.map((item, idx) => (
                                    <div key={idx} className={`p-6 rounded-xl border-l-4 shadow-sm bg-white ${item.point === 10 ? 'border-green-500' : (item.point > 0 ? 'border-yellow-500' : 'border-red-500')}`}>
                                        <div className="flex justify-between items-start mb-2">
                                            <h4 className="font-bold text-gray-800">Soal {idx + 1} <span className="text-xs font-normal text-gray-500 bg-gray-100 px-2 py-1 rounded ml-2">{item.q.level} - {item.q.type}</span></h4>
                                            <span className={`font-bold ${item.point === 10 ? 'text-green-600' : 'text-red-600'}`}>{item.point}/10 Poin</span>
                                        </div>
                                        <p className="text-gray-700 mb-4">{item.q.text}</p>
                                        <div className="bg-gray-50 p-4 rounded-lg text-sm mb-4">
                                            <p><span className="font-semibold">Jawaban Benar:</span> {Array.isArray(item.q.answer) ? item.q.answer.join(', ') : item.q.answer}</p>
                                            <p className="mt-1"><span className="font-semibold text-gray-600">Jawabanmu:</span> {Array.isArray(item.userAns) ? (item.userAns.length > 0 ? item.userAns.join(', ') : '-') : (item.userAns || '-')}</p>
                                        </div>
                                        <p className="text-sm text-indigo-900 bg-indigo-50 p-3 rounded"><i className="fas fa-info-circle mr-2"></i>{item.q.discussion}</p>
                                    </div>
                                ))}
                            </div>
                        </div>
                    </div>
                );
            }

            const q = ASSESSMENT_DATA[currentQ];
            const isPGK = q.type === 'PGK';

            return (
                <div className="h-full p-8 flex flex-col items-center justify-center bg-surface">
                    <div className="w-full max-w-3xl">
                        <div className="flex justify-between items-center mb-6">
                            <span className="font-bold text-primary">Soal {currentQ + 1} / 10</span>
                            <span className="text-xs bg-gray-200 text-gray-700 px-3 py-1 rounded-full font-medium">{q.level} • {q.type === 'PGK' ? 'Pilihan Ganda Kompleks (Pilih >1)' : 'Pilihan Tunggal'}</span>
                        </div>
                        
                        {/* Progress bar */}
                        <div className="w-full bg-gray-200 rounded-full h-2 mb-8">
                            <div className="bg-primary h-2 rounded-full transition-all duration-300" style={{ width: `${((currentQ + 1) / 10) * 100}%` }}></div>
                        </div>

                        <div className="bg-white p-8 rounded-2xl shadow-md border border-gray-100 mb-8">
                            <p className="text-xl text-gray-800 font-medium mb-6 leading-relaxed">{q.text}</p>
                            
                            <div className="space-y-3">
                                {q.options.map((opt, idx) => {
                                    let isSelected = false;
                                    if (isPGK) {
                                        isSelected = answers[q.id]?.includes(opt);
                                    } else {
                                        isSelected = answers[q.id] === opt;
                                    }

                                    return (
                                        <button 
                                            key={idx}
                                            onClick={() => handleAnswer(q.id, opt, isPGK)}
                                            className={`w-full text-left p-4 rounded-xl border-2 transition-all flex items-center gap-3 ${isSelected ? 'border-primary bg-indigo-50' : 'border-gray-200 hover:border-indigo-200 hover:bg-gray-50'}`}
                                        >
                                            <div className={`w-6 h-6 rounded flex items-center justify-center border ${isPGK ? 'rounded-md' : 'rounded-full'} ${isSelected ? 'bg-primary border-primary text-white' : 'border-gray-400'}`}>
                                                {isSelected && <i className="fas fa-check text-xs"></i>}
                                            </div>
                                            <span className={`text-lg ${isSelected ? 'text-primary font-medium' : 'text-gray-700'}`}>{opt}</span>
                                        </button>
                                    );
                                })}
                            </div>
                        </div>

                        <div className="flex justify-between">
                            <button 
                                onClick={() => setCurrentQ(prev => prev - 1)} 
                                disabled={currentQ === 0}
                                className={`px-6 py-3 rounded-xl font-bold transition ${currentQ === 0 ? 'bg-gray-100 text-gray-400 cursor-not-allowed' : 'bg-white border border-gray-300 text-gray-700 hover:bg-gray-50 shadow-sm'}`}
                            >
                                Sebelumnya
                            </button>
                            
                            {currentQ === ASSESSMENT_DATA.length - 1 ? (
                                <button 
                                    onClick={() => {
                                        if(confirm('Yakin ingin menyelesaikan asesmen?')) {
                                            calculateScore();
                                        }
                                    }}
                                    className="px-8 py-3 rounded-xl font-bold bg-green-500 hover:bg-green-600 text-white shadow-md transition"
                                >
                                    Selesaikan
                                </button>
                            ) : (
                                <button 
                                    onClick={() => setCurrentQ(prev => prev + 1)}
                                    className="px-8 py-3 rounded-xl font-bold bg-primary hover:bg-secondary text-white shadow-md transition"
                                >
                                    Berikutnya
                                </button>
                            )}
                        </div>
                    </div>
                </div>
            );
        };


        const App = () => {
            const [sidebarOpen, setSidebarOpen] = useState(false);
            const [currentModuleIdx, setCurrentModuleIdx] = useState(0);
            
            const currentModuleId = MODULES[currentModuleIdx].id;

            const toggleSidebar = () => setSidebarOpen(!sidebarOpen);
            const closeSidebar = () => setSidebarOpen(false);
            
            const goToNext = () => {
                if (currentModuleIdx < MODULES.length - 1) {
                    setCurrentModuleIdx(currentModuleIdx + 1);
                }
            };
            
            const goToPrev = () => {
                if (currentModuleIdx > 0) {
                    setCurrentModuleIdx(currentModuleIdx - 1);
                }
            };

            const toggleFullscreen = () => {
                if (!document.fullscreenElement) {
                    document.documentElement.requestFullscreen().catch((err) => {
                        console.log(`Error attempting to enable full-screen mode: ${err.message}`);
                    });
                } else {
                    if (document.exitFullscreen) {
                        document.exitFullscreen();
                    }
                }
            };

            // Keyboard navigation
            useEffect(() => {
                const handleKeyDown = (e) => {
                    if (e.key === 'Escape' && sidebarOpen) {
                        closeSidebar();
                    }
                };
                window.addEventListener('keydown', handleKeyDown);
                return () => window.removeEventListener('keydown', handleKeyDown);
            }, [sidebarOpen]);


            const renderContent = () => {
                switch (currentModuleId) {
                    case 'cover': return <Cover onStart={goToNext} />;
                    case 'orientasi': return <Orientasi />;
                    case 'apersepsi': return <Apersepsi />;
                    case 'teori_dasar': return <TeoriDasar />;
                    case 'teori_gramatik': return <TeoriGramatik />;
                    case 'visualisasi': return <Visualisasi />;
                    case 'aktivitas': return <Aktivitas />;
                    case 'penerapan': return <Penerapan />;
                    case 'rangkuman': return <Rangkuman />;
                    case 'refleksi': return <Refleksi />;
                    case 'asesmen': return <Asesmen />;
                    default: return <div className="p-8 text-center">Konten belum tersedia.</div>;
                }
            };

            return (
                <div className="flex h-full w-full bg-surface overflow-hidden text-gray-800">
                    <Sidebar 
                        isOpen={sidebarOpen} 
                        onClose={closeSidebar} 
                        modules={MODULES} 
                        currentModule={currentModuleId}
                        onSelect={(idx) => setCurrentModuleIdx(idx)}
                    />
                    
                    <div className="flex-1 flex flex-col h-full overflow-hidden relative">
                        {/* Only show topbar if not on cover, or show a simplified one */}
                        {currentModuleId !== 'cover' && (
                            <TopBar 
                                toggleSidebar={toggleSidebar} 
                                title={CONFIG.namaMPI} 
                                onPrev={goToPrev}
                                onNext={goToNext}
                                currentIdx={currentModuleIdx}
                                totalMods={MODULES.length}
                                toggleFullscreen={toggleFullscreen}
                            />
                        )}
                        
                        <main className={`flex-1 overflow-hidden relative transition-opacity duration-300`}>
                            {/* Key on id forces remount for fresh state on module switch if needed, but here we want state to persist where possible. 
                                For Asesmen, we might want it to persist until reset. 
                            */}
                            {renderContent()}
                        </main>
                    </div>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
